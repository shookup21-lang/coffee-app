<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1c1917" />
  <title>이안음료주문</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#eaf1fb;--card:#ffffff;--ink:#16243f;--sub:#7e8aa6;--line:#e8eef8;
      --p1:#3b82f6;--p2:#2563eb;--p3:#60a5fa;
      --tile:#e8f0fd;--soft:#eef5ff;--good:#22c55e;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
    .serif{font-family:'Pretendard',system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,select{font-family:inherit}

    /* header */
    header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
    .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-0.02em;white-space:nowrap;flex:0 0 auto}
    .logo .badge-ic{height:30px;padding:0 11px;border-radius:10px;background:linear-gradient(135deg,var(--p1),var(--p2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;letter-spacing:-0.01em;flex:0 0 auto}
    .h-right{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;justify-content:flex-end}
    .userchip{padding:6px 12px;border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.2;text-align:right;min-width:0;max-width:56vw;box-shadow:0 2px 8px rgba(80,90,160,.06)}
    .userchip .uc-name{font-size:12px;font-weight:600;color:var(--sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .userchip .uc-team{font-size:13px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .userchip:active{background:#f3f4fa}
    .bell{position:relative;width:40px;height:40px;border-radius:99px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(80,90,160,.06);flex:0 0 auto}
    .bell:active{background:#f3f4fa}
    .badge{position:absolute;top:5px;right:5px;background:#ff5a7a;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}

    .wrap{padding:6px 20px 120px}

    /* login */
    .login{background:linear-gradient(165deg,#5b81c6 0%,#3f5fa8 55%,#7190ce 100%);color:#fff;min-height:100vh;padding:64px 26px 40px;display:flex;flex-direction:column}
    .login .lc{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px}
    .login .brandrow{display:flex;align-items:center;gap:14px;margin-bottom:6px}
    .login .appicon{flex:0 0 auto;display:inline-flex;box-shadow:0 6px 16px rgba(20,30,80,.25);border-radius:12px}
    .login .brandrow h1{font-size:40px;line-height:1;font-weight:800;letter-spacing:-0.02em}
    .login h1{font-size:38px;line-height:1.08;font-weight:800;letter-spacing:-0.02em}
    .login p{color:rgba(255,255,255,.82);font-size:15px;margin-top:10px}
    .login .field{margin-top:26px}
    .login label{font-size:13px;color:rgba(255,255,255,.85);display:block;margin-bottom:9px;font-weight:600}
    .login input{width:100%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:16px;padding:16px;font-size:16px;outline:none}
    .login input::placeholder{color:rgba(255,255,255,.6)}
    .login input:focus{border-color:#fff;background:rgba(255,255,255,.24)}
    .login .teams{display:flex;gap:8px}
    .login .teams button{flex:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:16px;padding:15px 0;font-size:14px;font-weight:600}
    .login .teams button.on{background:#fff;color:#2563eb;border-color:#fff}
    /* wrapping team grid (many teams) */
    .login .teamgrid{display:flex;flex-wrap:wrap;gap:8px;max-height:38vh;overflow-y:auto;padding:2px}
    .login .teamgrid button{flex:0 0 calc(50% - 4px);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:14px;padding:14px 8px;font-size:14px;font-weight:600;text-align:center;line-height:1.2;word-break:break-word}
    .login .teamgrid button.on{background:#fff;color:#2563eb;border-color:#fff}
    .teamgrid{display:flex;flex-wrap:wrap;gap:8px}
    .teamgrid button{flex:0 0 calc(50% - 4px);background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 8px;font-weight:700;font-size:14px;text-align:center;line-height:1.2;word-break:break-word;box-shadow:0 2px 8px rgba(80,90,160,.05)}
    .login .start{margin-top:auto;background:#fff;color:#2563eb;font-weight:800;border-radius:18px;padding:18px;font-size:16px;box-shadow:0 8px 20px rgba(40,30,120,.2)}
    .login .start:disabled{background:rgba(255,255,255,.4);color:rgba(109,92,255,.5);box-shadow:none}
    .login .blink{margin-top:18px;text-align:center;color:rgba(255,255,255,.85);font-size:14px;text-decoration:underline}

    /* hero gradient banner */
    .hero{background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:#fff;border-radius:26px;padding:24px 24px 26px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 14px 30px rgba(37,99,235,.30)}
    .hero .bigcup{position:absolute;right:-6px;bottom:-10px;font-size:96px;line-height:1;user-select:none;opacity:.9}
    .hero .rel{position:relative;z-index:1}
    .hero .team{font-size:13px;font-weight:700;margin-bottom:8px;color:rgba(255,255,255,.9)}
    .hero h1{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-0.02em}
    .hero .sub{font-size:14px;color:rgba(255,255,255,.88);margin-top:8px}

    /* greeting (home top) */
    .greet{padding:4px 4px 14px}
    .greet h1{font-size:28px;font-weight:800;line-height:1.25;letter-spacing:-0.02em}
    .greet h1 .nm{color:#2563eb}
    .greet .date{color:var(--sub);font-size:15px;margin-top:8px}

    /* window bar */
    .windowbar{display:flex;gap:8px;margin-bottom:14px}
    .holnote{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
    .windowbar.holiday .wb{opacity:.55}
    .wb.soon{background:linear-gradient(135deg,#f97316,#ea580c)!important;box-shadow:0 8px 20px rgba(234,88,12,.32)!important}
    .hero .sub .soon{color:#fde68a;font-weight:800}
    .soonbar{background:#fff4e5;color:#c2410c;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:700;margin-bottom:14px}
    .hcell.hol{background:#fee2e2;color:#b91c1c}
    .hcell.hol .cal-n{color:#dc2626}
    .hcell.wkoff{background:#fdf2f2;color:#d97777}
    .hcell.wkoff .cal-n{color:#e8a0a0}
    .holrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(80,90,160,.05)}
    .holrow .hr-d{flex:0 0 auto;font-size:14px;font-weight:800;color:#b91c1c;min-width:74px}
    .holrow input{flex:1;min-width:0;border:1px solid #e8eef8;background:#f7faff;border-radius:10px;font-size:14px;outline:none;font-weight:600;padding:9px 10px}
    .holrow input:focus{border-color:#3b82f6;background:#fff}
    .wkrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .wkrow .wl{font-size:15px;font-weight:800}
    .wkrow .ws{font-size:12px;color:var(--sub);margin-top:3px}
    .noticebox{display:flex;gap:9px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:13px 15px;margin-bottom:14px}
    .noticebox .ic{font-size:16px;line-height:1.5;flex:0 0 auto}
    .noticebox .tx{font-size:13.5px;line-height:1.55;color:#92700a;font-weight:600;word-break:keep-all}
    .noticeta{width:100%;min-height:120px;border-radius:16px;border:1px solid #dbe4f3;background:#fff;padding:14px;font-size:15px;font-family:inherit;color:var(--ink);resize:vertical;box-sizing:border-box}
    .wb{flex:1 1 0;min-width:0;border-radius:18px;padding:14px 8px;text-align:center;background:#eef1f6;overflow:hidden}
    .wb .wlbl{font-size:11px;color:#9aa4b6;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
    .wb .wtime{font-size:13px;font-weight:800;margin-top:4px;color:#aeb7c7;white-space:nowrap}
    .wb .live{display:none;width:7px;height:7px;border-radius:99px;background:#fff;animation:wbpulse 1.5s infinite}
    @keyframes wbpulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 6px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
    .wb.open{background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(37,99,235,.32)}
    .wb.open .wlbl{color:#fff}
    .wb.open .wtime{color:#fff}
    .wb.open .live{display:inline-block}

    /* buttons */
    .primary{width:100%;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-weight:800;font-size:16px;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(59,130,246,.30)}
    .primary:active{filter:brightness(.96)}
    .primary:disabled{background:#bcc9e2;color:#fff;box-shadow:none}
    .ghost{width:100%;background:#fff;color:var(--ink);font-weight:700;font-size:15px;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;box-shadow:0 3px 12px rgba(80,90,160,.06)}
    .ghost:active{background:#eef4fc}

    h2.sec{font-size:18px;margin:24px 4px 12px;font-weight:800;letter-spacing:-0.01em}
    .empty{background:#fff;border-radius:20px;padding:34px;text-align:center;color:#9aa6bd;font-size:14px;box-shadow:0 3px 12px rgba(80,90,160,.05)}
    .awakebtn.on{background:#eaf6ec;color:#15803d}
    /* 집계 캘린더 */
    .cal-wrap{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(80,90,160,.07);overflow:hidden}
    .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .cal-title{font-size:16px;font-weight:800;color:#16243f}
    .cal-arr{width:34px;height:34px;border-radius:10px;background:#eef3fc;font-size:18px;color:#2563eb;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .cal-arr.disabled{color:#c4d4ef;background:#f3f6fb;pointer-events:none}
    .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:36px;gap:3px}
    .cal-dow-cell{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#9aa6bd;min-width:0}
    .cal-cell{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#16243f;cursor:pointer;background:#f5f8ff;min-width:0;overflow:hidden}
    .cal-cell.empty{background:transparent;cursor:default;pointer-events:none}
    .cal-cell.future{color:#c4d4ef;background:#f0f3fb;cursor:default;pointer-events:none}
    .cal-cell:not(.empty):not(.future):active{background:#dde8f7}
    .cal-cell.today{background:#dde8f7;color:#2563eb;font-weight:800}
    .cal-cell.sel{background:#2563eb;color:#fff;font-weight:800}
    /* 집계 상세 */
    .stats-detail{background:#fff;border-radius:20px;padding:18px;box-shadow:0 3px 12px rgba(80,90,160,.07)}
    .sd-head{font-size:15px;font-weight:800;color:#16243f;margin-bottom:14px}
    .sd-section{margin-bottom:14px}
    .sd-section:last-child{margin-bottom:0}
    .sd-sub{font-size:12px;font-weight:800;color:#9aa6bd;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
    .stat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f4fb}
    .stat-row:last-child{border-bottom:0}
    .stat-row .sr-name{flex:1;font-size:14px;font-weight:600;color:#16243f;min-width:0}
    .sr-rank{flex:0 0 18px;font-size:12px;font-weight:800;color:#9aa6bd;text-align:center}
    .sr-bar{display:block;height:5px;background:#f0f4fb;border-radius:99px;margin-top:5px;overflow:hidden}
    .sr-bar i{display:block;height:100%;border-radius:99px;opacity:.75}
    .msum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:16px}
    .msum div{background:#f5f8ff;border-radius:12px;padding:10px 4px;text-align:center}
    .msum b{display:block;font-size:18px;font-weight:800;color:#2563eb}
    .msum small{font-size:11px;color:var(--sub);font-weight:600}
    .cal-cell{flex-direction:column;line-height:1.05}
    .cal-n{font-size:9.5px;font-weight:800;color:#2563eb;margin-top:1px}
    .cal-cell.sel .cal-n{color:#dbeafe}
    .sd-back{float:right;font-size:12px;font-weight:700;color:#2563eb;cursor:pointer}
    .stat-row b{font-size:15px;font-weight:800;color:#2563eb}

    /* tiles (flat color-bar look) */
    .grid2{display:flex;flex-wrap:wrap;justify-content:space-between}
    .drink{width:48.5%;background:#fff;border-radius:16px;padding:0;text-align:left;margin-bottom:11px;box-shadow:0 2px 8px rgba(80,90,160,.05);overflow:hidden;transition:transform .05s}
    .drink:active{transform:scale(.97)}
    .drink.on{outline:2px solid #2563eb;outline-offset:-2px}
    .drink .em{width:100%;height:8px;border-radius:0}
    .drink .dn{font-weight:700;padding:12px 14px 14px;font-size:14.5px;color:#16243f;display:flex;flex-direction:column;align-items:flex-start;gap:6px}

    /* my cup card */
    .mycup{background:#fff;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:8px;box-shadow:0 6px 18px rgba(80,90,160,.08)}
    .mycup .mc{width:28px;height:28px;border-radius:9px;flex:0 0 auto}
    .mycup .mlbl{font-size:12px;color:#2563eb;font-weight:700}
    .mycup .mname{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:-0.01em}
    .mycup .mstat{font-size:13px;color:var(--sub);margin-top:6px}
    .mycup .pickno{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eef3fc;border-radius:14px;padding:8px 14px;min-width:52px}
    .mycup .pickno .pickno-lbl{font-size:10px;font-weight:700;color:#5b7bb8;white-space:nowrap}
    .mycup .pickno .pickno-n{font-size:24.2px;font-weight:700;color:#2563eb;line-height:1.2;margin-top:1px;font-family:'Roboto Mono',monospace;-webkit-text-stroke:0.3px currentColor}
    .mycup .pickno.orange{background:#fff2e8}
    .mycup .pickno.orange .pickno-lbl{color:#c2632a}
    .mycup .pickno.orange .pickno-n{color:#f97316}
    .mycup .pickno.green{background:#e9f7ee}
    .mycup .pickno.green .pickno-lbl{color:#227a45}
    .mycup .pickno.green .pickno-n{color:#16a34a}
    .chg{font-size:13px;color:#2563eb;font-weight:600;margin-top:8px;display:inline-block}

    .back{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:#2563eb;padding:12px 18px 12px 12px;margin-bottom:10px;font-weight:700;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(80,90,160,.06)}
    .back:active{background:#eef4fc}
    /* color square used in place of drink emoji */
    .csq{display:inline-block;border-radius:7px;vertical-align:middle}
    .csq.sm{width:18px;height:18px;border-radius:5px}
    .csq.md{width:26px;height:26px}
    .csq.lg{width:46px;height:46px;border-radius:12px}

    /* order rows */
    .orow{background:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;box-shadow:0 2px 10px rgba(80,90,160,.05)}
    .orow .nm{font-weight:700}
    .orow .dr{font-size:13px;color:var(--sub);margin-top:2px}
    .pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px}
    .pill.pending{background:#fff4e6;color:#e08a14}
    .pill.confirmed{background:#eaf1ff;color:#3b6ef5}
    .pill.ready{background:#e7f9ee;color:#16a34a}

    /* barista dashboard (For me banner style) */
    .dash{position:relative;overflow:hidden;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:#fff;border-radius:24px;padding:18px 20px;margin-bottom:16px;box-shadow:0 14px 30px rgba(37,99,235,.30)}
    .dash .dashbody{position:relative;z-index:1}
    .dash .dashemo{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:72px;line-height:1;opacity:.92;user-select:none;pointer-events:none}
    .dash .date{font-size:13px;color:rgba(255,255,255,.85);margin-bottom:3px;font-weight:600}
    .dash h1{font-size:22px;font-weight:800;letter-spacing:-0.02em}
    .dash .stats{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
    .dash .stat b{font-size:26px;display:block;font-weight:800}
    .dash .stat.a b{color:#ffe8a3}
    .dash .stat small{font-size:12px;color:rgba(255,255,255,.85)}

    .navbtns{display:flex;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
    .navbtns button{width:48.5%;background:var(--tile);border-radius:20px;padding:18px 14px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:11px;color:#16243f;box-shadow:0 2px 10px rgba(80,90,160,.05)}
    .navbtns button .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
    .navbtns button:active{transform:scale(.97)}
    /* heading row with inline refresh */
    .sechead{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 12px}
    .sechead h2{font-size:18px;font-weight:800}
    .refreshbtn{background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;color:#2563eb;box-shadow:0 2px 8px rgba(80,90,160,.08)}
    .refreshbtn:active{background:#eef4fc}
    /* text-only management menu (compact) */
    .navtext{display:flex;flex-wrap:wrap;gap:8px}
    .navtext button{flex:0 0 calc(50% - 4px);background:var(--tile);border-radius:14px;padding:14px;font-weight:700;font-size:15px;color:#16243f;box-shadow:0 2px 8px rgba(80,90,160,.05)}
    .navtext button:active{background:#dde8f7}

    .dash .dashfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.25)}
    .dash .dashfoot .dfstatus{font-size:12px;color:rgba(255,255,255,.85);min-width:0}
    .swt{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto}
    .swt .swt-l{font-size:13px;font-weight:800;color:#fff}
    .swt .swt-t{width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.30);position:relative;transition:background .15s;flex:0 0 auto}
    .swt .swt-t::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:#fff;transition:transform .15s}
    .swt.on .swt-t{background:#34d399}
    .swt.on .swt-t::after{transform:translateX(16px)}

    .sectlbl{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 9px}
    .qrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 10px rgba(80,90,160,.06)}
    .qrow.making{outline:2px solid #2563eb;outline-offset:-2px}
    .qrow.done{opacity:.5}
    .qno{flex:0 0 auto;width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;color:#fff;font-family:'Roboto Mono',monospace;-webkit-text-stroke:0.3px currentColor}

    const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

    }
    // 오늘 하루 리셋되는 수령 번호 (컵에 적어서 찾아가는 용도) — 서버 트랜잭션으로 원자적 발급 (동시 주문에도 안 겹침)
    // 신규 주문 생성: 번호 예약 + 주문 저장을 하나의 트랜잭션으로 묶어서, 중간에 실패해도 번호만 소모되고 주문이 안 남는 일이 없게 함
    // ※ 주문이 한꺼번에 몰리면(예: 주문 시작 시각에 30명 동시) 같은 문서를 두고 트랜잭션이 서로 충돌해 실패할 수
    //   있음(시뮬레이션으로 확인). 그래서 트랜잭션을 몇 번 시도해도 안 되면, 번호 없이 주문부터 확실히 저장하고
    //   (충돌이 없는 일반 쓰기) 번호는 잠시 뒤 따로 발급함(ensureMyNumber + 담당자 기기 repairPickupNos).
    //   → 주문이 사라지는 일은 없고, 번호만 1~2초 늦게 나올 수 있음.
    async function commitNewOrder(fields){
      const ref=doc(db,"daily",todayKey());
      fields={...fields, build:APP_BUILD}; // 어느 버전 앱이 만든 주문인지 기록 (번호 문제 추적용)
      try{
        const no=await runTransaction(db, async tx=>{
          const snap=await tx.get(ref);
          const data=snap.exists()?snap.data():{};
          const already=(data.orders||{})[fields.id];
          if(already && already.no) return already.no; // 앞선 시도가 이미 저장됐으면 그대로 (중복 방지)
          const next=nextPickupNo(data);
          tx.set(ref,{orders:{[fields.id]:{...fields, no:next}}, nextNo:next},{merge:true});
          return next;
        }, {maxAttempts:3});
        state.orders={...state.orders,[fields.id]:{...fields, no}};
        return no;
      }catch(e){
        console.warn("번호 발급 트랜잭션 실패 → 주문만 먼저 저장", e);
        await setDoc(ref,{orders:{[fields.id]:fields}},{merge:true}); // 충돌 없는 일반 쓰기 (merge라 혹시 저장된 번호가 있어도 안 지워짐)
        state.orders={...state.orders,[fields.id]:{...(state.orders[fields.id]||{}), ...fields}};
        ensureMyNumber(fields.id);
        return null;
      }
    }
    // 번호 없이 저장된 내 주문에 번호 붙이기 (몰림이 풀릴 때까지 간격을 두고 재시도, 담당자 기기가 먼저 붙이면 종료)
    async function ensureMyNumber(id){
      for(let i=0;i<10;i++){
        await new Promise(r=>setTimeout(r, 800+Math.random()*1500*(1+i*0.5)));
        const cur=state.orders[id];
        if(!cur || Number(cur.no)>0) return;
        try{
          await runTransaction(db, async tx=>{
            const ref=doc(db,"daily",todayKey());
            const snap=await tx.get(ref); if(!snap.exists()) return;
            const data=snap.data(), o=(data.orders||{})[id];
            if(!o || Number(o.no)>0) return;
            const next=nextPickupNo(data);
            tx.update(ref, new FieldPath("orders",id,"no"), next, "nextNo", next);
          }, {maxAttempts:2});
        }catch(e){ /* 다음 회차에 다시 */ }
      }
    }
    // 트랜잭션이 몰림으로 실패하면 잠깐 쉬었다가 다시 (담당자 버튼·변경·취소 등 기존 주문 수정용)
    async function txRun(fn){
      for(let i=0;;i++){
        try{ return await runTransaction(db, fn); }
        catch(e){ if(i>=2 || (e&&e.code==="permission-denied")) throw e; await new Promise(r=>setTimeout(r, 400+Math.random()*900)); }
      }
    }
    // 다음 수령 번호 = (카운터, 오늘 이미 쓰인 가장 큰 번호) 중 큰 것 + 1
    // → 옛날 버전 앱이 카운터를 안 올리거나 낮은 값으로 덮어써도, 이미 나간 번호와 겹치지 않음
    function nextPickupNo(data){
      let mx=Number(data.nextNo)||0;
      Object.values(data.orders||{}).forEach(o=>{ const n=Number(o&&o.no); if(n>mx) mx=n; });
      return mx+1;
    }
    // 안전망: 그래도 번호가 겹치거나 빠진 "대기" 주문이 보이면 담당자 기기가 자동으로 새 번호를 다시 발급.
    // 먼저 들어온 주문이 원래 번호를 유지하고, 나중 주문만 바뀜. 제조를 시작한 주문(컵에 번호를 적었을 수
    // 있음)은 절대 바꾸지 않음. 원인이 무엇이든(옛날 버전 폰, 알 수 없는 오류) 번호 중복을 잡기 위한 장치.
    function pickupNoProblems(orders){
      const fixed=new Set(), bad=[];
      const list=Object.entries(orders||{}).sort((a,b)=>new Date(a[1].time)-new Date(b[1].time));
      list.forEach(([id,o])=>{ if(o.status!=="pending" && Number(o.no)>0) fixed.add(Number(o.no)); });
      list.forEach(([id,o])=>{
        const n=Number(o.no);
        if(o.status!=="pending"){ if(!(n>0)) bad.push(id); return; } // 번호가 아예 없는 주문은 상태와 관계없이 발급
        if(n>0 && !fixed.has(n)) fixed.add(n); else bad.push(id);
      });
      return bad; // 새 번호가 필요한 주문 id (시간순)
    }
    let _repairingNos=false;
    async function repairPickupNos(){
      if(_repairingNos) return;
      _repairingNos=true;
      try{
        const ref=doc(db,"daily",todayKey());
        const changed=await txRun(async tx=>{
          const snap=await tx.get(ref);
          if(!snap.exists()) return [];
          const data=snap.data(), orders=data.orders||{};
          const bad=pickupNoProblems(orders);
          if(!bad.length) return [];
          let next=nextPickupNo(data)-1;
          const args=[], log=[];
          bad.forEach(id=>{ next++; args.push(new FieldPath("orders",id,"no"), next); if(Number(orders[id].no)>0) log.push(`${orders[id].no}→${next}`); }); // 안내는 "겹친 번호"만 (번호 없던 주문은 조용히 발급)
          args.push("nextNo", next);
          tx.update(ref, ...args);
          return log;
        });
        if(changed.length) toast(`겹친 수령 번호를 자동으로 고쳤어요 (${changed.join(", ")})`);
      }catch(e){ console.error(e); }
      finally{ _repairingNos=false; }
    }
    // 표시용 수령 번호: 저장된 번호가 있으면 그대로, 없으면(기능 적용 이전 주문) 오늘 전체 시간순 순위로 대체 — 항상 팀 구분 없는 전체 고유 번호
    function pickNo(o){
      // 번호가 아직 없으면(주문이 몰려 발급 대기 중) "…" — 예전처럼 임시 순위를 보여주면 다른 사람 번호와 겹쳐 보일 수 있음
      return Number(o.no)>0 ? o.no : "…";
    }

    // ---------- firestore ----------
    // 입력 중인 화면(타이핑 내용이 저장 전까지 DOM에만 있는 화면)에서는 실시간 업데이트가 와도
    // 화면을 다시 그리지 않음 — state는 항상 최신으로 갱신되고, 화면 반영만 편집이 끝난 뒤로 미룸
    const EDIT_VIEWS=new Set(["team-edit","menu-edit","time-edit","notice-edit","hol-edit"]);
    function safeRender(){ if(!EDIT_VIEWS.has(state.view)) render(); }

    let _dailyUnsub=null, _dailyKey=null;
    function subscribeDaily(){
      const key=todayKey();
      if(_dailyKey===key) return; // 이미 오늘 날짜에 연결돼 있음
      if(_dailyUnsub){ _dailyUnsub(); _dailyUnsub=null; }
      _dailyKey=key;
      // 날짜가 바뀌면 어제 데이터 잔재가 남지 않도록 하루 단위 상태 초기화
      _knownIds=null; _myReadyIds=null; state.orders={};
      _dailyUnsub=onSnapshot(doc(db,"daily",key),s=>{
        const d=s.exists()?s.data():{}; const orders=d.orders||{};
        const ids=Object.keys(orders);
        const isBarista=state.user&&state.user.team==="barista";
        // 담당자: 새 주문이 들어오면 딩동은 즉시, 음성은 묶어서 안내 (입력 중이어도 그대로 동작)
        const newCount=ids.filter(id=>!(_knownIds&&_knownIds.has(id))).length;
        if(_knownIds!==null && isBarista && newCount>0){ playDing(); announceNewOrders(newCount); }
        _knownIds=new Set(ids);
        // 직원: 내 음료가 새로 '준비됨'으로 바뀌면 딩동
        if(state.user && !isBarista){
          const myReady=ids.filter(id=>{const o=orders[id]; return o&&o.status==="ready"&&isMyOrder(o);});
          if(_myReadyIds!==null && myReady.some(id=>!_myReadyIds.has(id))) playDing();
          _myReadyIds=new Set(myReady);
        }
        state.orders=orders; checkNotif(); safeRender();
        if(isBarista && pickupNoProblems(orders).length) repairPickupNos();
      },e=>console.error(e));
    }
    function startSync(){
      subscribeDaily();
      onSnapshot(doc(db,"config","menu"),s=>{ if(s.exists()&&Array.isArray(s.data().items)&&s.data().items.length){ state.menu=dedupeMenuColors(s.data().items); } else state.menu=DEFAULT_MENU; safeRender(); },e=>console.error(e));
      onSnapshot(doc(db,"config","teams"),s=>{ if(s.exists()&&Array.isArray(s.data().items)&&s.data().items.length) state.teams=s.data().items.map((t,i)=>({...t, color:colorFor(i)})); else state.teams=DEFAULT_TEAMS; safeRender(); },e=>console.error(e));
      onSnapshot(doc(db,"config","hours"),s=>{ if(s.exists()) state.hours={...DEFAULT_HOURS,...s.data()}; safeRender(); },e=>console.error(e));
      onSnapshot(doc(db,"config","holidays"),s=>{ const d=s.exists()?s.data():{}; state.holidays={days:d.days||{}}; safeRender(); },e=>console.error(e));
      onSnapshot(doc(db,"config","notice"),s=>{ state.notice = (s.exists()&&s.data().text)? s.data() : null; safeRender(); },e=>console.error(e));
    }
    // 기존 주문 수정: 전체 주문 목록을 덮어쓰지 않고, 서버의 "그 주문 하나"만 트랜잭션으로 읽고 고침.
    // (예전 saveOrders는 내 폰에 있던 전체 목록을 통째로 저장해서, 동시에 다른 사람이 바꾼 주문 상태·음료가
    //  옛날 값으로 되돌아가거나 삭제된 주문이 되살아날 위험이 있었음)
    // mutate(cur) → 바꾼 주문 객체를 반환하면 저장, 문자열을 반환하면 저장하지 않고 그 사유를 돌려줌
    async function updateOrder(id, mutate){
      const ref=doc(db,"daily",todayKey());
      const res=await txRun(async tx=>{
        const snap=await tx.get(ref);
        const cur=snap.exists() ? (snap.data().orders||{})[id] : null;
        if(!cur) return {err:"gone"};
        const next=mutate(cur);
        if(typeof next==="string") return {err:next, cur};
        tx.update(ref, new FieldPath("orders", id), next);
        return {ok:next};
      });
      if(res.ok) state.orders={...state.orders,[id]:res.ok};
      return res;
    }
    // 여러 주문을 한 번에 수정 (묶어서 시작/완료, 전체 수령 등). mutate가 문자열을 돌려준 주문은 건너뜀.
    async function updateOrders(ids, mutate){
      const ref=doc(db,"daily",todayKey());
      const done=await txRun(async tx=>{
        const snap=await tx.get(ref);
        const orders=snap.exists() ? (snap.data().orders||{}) : {};
        const args=[], ok={};
        ids.forEach(id=>{
          const cur=orders[id]; if(!cur) return;
          const next=mutate(cur); if(!next || typeof next==="string") return;
          args.push(new FieldPath("orders", id), next); ok[id]=next;
        });
        if(args.length) tx.update(ref, ...args);
        return ok;
      });
      state.orders={...state.orders, ...done};
      return Object.keys(done).length;
    }
    // 수정 실패 사유를 사용자에게 안내 (true=실패해서 안내함)
    function orderFailToast(res){
      if(res.ok) return false;
      if(res.err==="gone") toast("이미 삭제된 주문이에요");
      else if(res.err==="started") toast("이미 제조가 시작돼서 바꿀 수 없어요");
      else if(res.err==="stale") toast("다른 기기에서 이미 처리됐어요");
      else if(res.err==="changed") toast("방금 음료가 바뀌었어요. 확인하고 다시 눌러 주세요");
      render(); return true;
    }
    const saveMenu=async i=>{state.menu=i;await setDoc(doc(db,"config","menu"),{items:i});};
    const saveTeams=async i=>{state.teams=i;await setDoc(doc(db,"config","teams"),{items:i});};
    const saveHours=async h=>{state.hours=h;await setDoc(doc(db,"config","hours"),h);};
    const saveNotice=async text=>{
      const t=(text||"").trim();
      if(!t){ state.notice=null; await setDoc(doc(db,"config","notice"),{text:"",updatedAt:new Date().toISOString()}); return; }
      state.notice={text:t,updatedAt:new Date().toISOString()};
      await setDoc(doc(db,"config","notice"),state.notice);
    };

    // ---------- notifications ----------
    function isMyOrder(o){
      // an order "belongs" to this user if they placed it (their own, or one they ordered on behalf of someone)
      return sameName(o.by,state.user.name) || (sameName(o.name,state.user.name) && (!o.by));
    }
    function checkNotif(){
      if(!state.user||state.user.team==="barista")return;
      Object.entries(state.orders).forEach(([id,o])=>{
        if(isMyOrder(o) && o.status==="ready" && !state.seenReady.includes(id)){
          if("Notification" in window && Notification.permission==="granted"){
            try{
              const who = !sameName(o.name,state.user.name) ? `${o.name}님 ` : "";
              new Notification("☕ 음료가 준비됐어요!",{body:`${who}음료가 완성됐어요. 1층에서 가져가세요.`,icon:"icon-192.png"});
            }catch(e){}
          }
        }
      });
    }
    function myNotifs(){
      if(!state.user||state.user.team==="barista")return [];
      return Object.entries(state.orders).filter(([id,o])=>isMyOrder(o)&&o.status==="ready"&&!state.seenReady.includes(id)).map(([id,o])=>({id,...o}));
    }

    // ---------- helpers ----------
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const menuById=id=>state.menu.find(m=>m.id===id);
    const timeStr=iso=>new Date(iso).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    const krSort=(a,b)=>a.localeCompare(b,"ko");

    // ============ RENDER ============
    function render(){
      // 태블릿/PC처럼 넓은 화면에서 담당자 메인은 2단으로 넓게 (CSS의 body.wide 참고)
      document.body.classList.toggle("wide", !!(state.user && state.user.team==="barista" && !["menu-edit","team-edit","time-edit","notice-edit","hol-edit","disp","stats"].includes(state.view)));
      if(!state.user) return renderLogin();
      maybeWake();
      syncHistory();
      app.innerHTML = renderHeader() + `<div class="wrap" id="wrap"></div>`;
      const w=document.getElementById("wrap");
      if(state.user.team==="barista"){
        if(state.view==="menu-edit") w.innerHTML=renderMenuEdit();
        else if(state.view==="team-edit") w.innerHTML=renderTeamEdit();
        else if(state.view==="time-edit") w.innerHTML=renderTimeEdit();
        else if(state.view==="disp") w.innerHTML=renderDispense();
        else if(state.view==="stats") w.innerHTML=renderStats();
        else if(state.view==="notice-edit") w.innerHTML=renderNoticeEdit();
        else if(state.view==="hol-edit") w.innerHTML=renderHolEdit();
        else w.innerHTML=renderBarista();
      } else {
        if(state.view==="order") w.innerHTML=renderOrder();
        else if(state.view==="add-person") w.innerHTML=renderAddPerson();
        else if(state.view==="notifications") w.innerHTML=renderNotifs();
        else if(state.view==="team-list") w.innerHTML=renderTeamList();
        else if(state.view==="edit-order") w.innerHTML=renderEditOrder();
        else w.innerHTML=renderHome();
      }
      bind();
      fitQdrinkText();
    }

    // ----- hardware/browser back handling -----
    // When we move to a sub-view, push one history entry. Android's back button
    // (and browser back) then fires popstate, which we use to return to home.
    let _onSub = false;
    function syncHistory(){
      const isSub = state.user && state.view !== "home";
      if(isSub && !_onSub){ history.pushState({sub:true}, ""); _onSub = true; }
      else if(!isSub){ _onSub = false; }
    }
    window.addEventListener("popstate", ()=>{
      if(state.user && state.view !== "home"){
        state.view = "home";
        _onSub = false;
        render();
      }
      // if already on home, let the browser/OS handle it (exits app)
    });

    function renderHeader(){
      const u=state.user, isB=u.team==="barista", t=teamById(u.team), nc=myNotifs().length;
      return `<header>
        <div class="logo"><span class="badge-ic">iaan</span>${APP_NAME}</div>
        <div class="h-right">
          ${!isB?`<button class="bell" data-act="bell">🔔${nc>0?`<span class="badge">${nc}</span>`:""}</button>`:""}
          <button class="userchip" data-act="logout"><span class="uc-team" style="color:${isB?'#2563eb':t.color}">${isB?'담당자':esc(t.name)}</span><span class="uc-name">${esc(u.name)}</span></button>
        </div></header>`;
    }

    // ---- login ----
    function appIconSVG(size){
      return `<svg width="${size}" height="${size}" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;border-radius:${Math.round(size*0.226)}px">
        <defs>
          <linearGradient id="libg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
          <linearGradient id="liliq" x1="0" y1="240" x2="0" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#libg)"/>
        <rect x="296" y="118" width="20" height="200" rx="10" transform="rotate(12 306 218)" fill="#ffffff"/>
        <path d="M176 214 h160 v176 a26 26 0 0 1 -26 26 H202 a26 26 0 0 1 -26 -26 z" fill="#ffffff" opacity="0.96"/>
        <path d="M188 252 h136 v138 a18 18 0 0 1 -18 18 H206 a18 18 0 0 1 -18 -18 z" fill="url(#liliq)"/>
        <circle cx="256" cy="306" r="34" fill="#fff7cc"/>
        <circle cx="256" cy="306" r="34" stroke="#f59e0b" stroke-width="6"/>
        <g stroke="#f59e0b" stroke-width="4"><line x1="256" y1="276" x2="256" y2="336"/><line x1="226" y1="306" x2="286" y2="306"/><line x1="235" y1="285" x2="277" y2="327"/><line x1="277" y1="285" x2="235" y2="327"/></g>
        <circle cx="214" cy="288" r="7" fill="#ffffff" opacity="0.85"/><circle cx="300" cy="350" r="6" fill="#ffffff" opacity="0.8"/><circle cx="220" cy="356" r="5" fill="#ffffff" opacity="0.75"/>
        <rect x="170" y="206" width="172" height="20" rx="10" fill="#bfdbfe"/><rect x="186" y="232" width="140" height="10" rx="5" fill="#dbeafe" opacity="0.8"/>
      </svg>`;
    }
    function renderLogin(){
      app.innerHTML=`<div class="login">
        <div class="brandrow"><span class="appicon">${appIconSVG(52)}</span><h1 class="serif" style="margin:0">${APP_NAME}</h1></div>
        <p>팀을 선택하고 이름을 입력하세요</p>
        <div class="field"><label>팀 선택</label>

      el.value=nm(el.value); try{ el.setSelectionRange(before,before); }catch(_){}
      if(!_spaceWarned){ _spaceWarned=true; toast("이름은 띄어쓰기 없이 입력해 주세요"); }

    // ---- 집계 뷰 ----
    // ---- 집계: 한 달치 불러오기 ----
    let _statsLoadingYM=null;
    async function loadStatsMonth(ym){
      if(_statsLoadingYM===ym) return;
      _statsLoadingYM=ym;
      const [yr,mo]=ym.split("-").map(Number), days=new Date(yr,mo,0).getDate();
      let byDay={};
      try{
        // 한 번의 조회로 그 달 문서 전부 (문서 id가 날짜라 범위 조회 가능)
        const qs=await getDocs(query(collection(db,"daily"), where(documentId(),">=",`${ym}-01`), where(documentId(),"<=",`${ym}-31`)));
        qs.forEach(d=>{ byDay[d.id]=d.data().orders||{}; });
      }catch(e){
        // 보안 규칙상 범위 조회가 막혀 있으면 하루씩 조회
        console.warn("month query failed, fallback per day", e);
        const keys=[]; for(let d=1; d<=days; d++){ const k=`${ym}-${String(d).padStart(2,"0")}`; if(k<=todayKey()) keys.push(k); }
        const snaps=await Promise.all(keys.map(k=>getDoc(doc(db,"daily",k)).catch(()=>null)));
        snaps.forEach((sn,i)=>{ if(sn && sn.exists()) byDay[keys[i]]=sn.data().orders||{}; });
      }
      _statsLoadingYM=null;
      if(state.statsMonth===ym){ state.statsMonthData={ym, byDay}; if(state.view==="stats") render(); }
    }
    function statsByDay(){
      const md=state.statsMonthData; if(!md || md.ym!==state.statsMonth) return null;
      const byDay={...md.byDay};
      if(todayKey().startsWith(state.statsMonth)) byDay[todayKey()]=state.orders; // 오늘은 실시간 데이터로
      return byDay;
    }
    // 메뉴별·팀별 순위 HTML (하루/한 달 공용)
    function rankRowsHTML(list){
      const total=list.length||1;
      const menuCount={}, teamCount={};
      list.forEach(o=>{ menuCount[o.drinkId]=(menuCount[o.drinkId]||0)+1; teamCount[o.team]=(teamCount[o.team]||0)+1; });
      const bar=(cnt,color)=>`<span class="sr-bar"><i style="width:${Math.round(cnt/total*100)}%;background:${color}"></i></span>`;
      const menuRows=Object.entries(menuCount).sort((a,b)=>b[1]-a[1]).map(([id,cnt],i)=>{
        const m=menuById(id), c=m?mColor(m):"#ccc";
        return `<div class="stat-row"><span class="sr-rank">${i+1}</span><span class="csq sm" style="background:${c}"></span><span class="sr-name">${m?drinkNameHTML(m.name):"알 수 없음"}${bar(cnt,c)}</span><b>${cnt}잔</b></div>`;
      }).join("");
      const teamRows=Object.entries(teamCount).sort((a,b)=>b[1]-a[1]).map(([tid,cnt],i)=>{
        const t=teamById(tid);
        return `<div class="stat-row"><span class="sr-rank">${i+1}</span><span class="csq sm" style="background:${t.color}"></span><span class="sr-name">${esc(t.name)}${bar(cnt,t.color)}</span><b>${cnt}잔</b></div>`;
      }).join("");
      return `<div class="sd-section"><div class="sd-sub">메뉴별</div>${menuRows}</div>
              <div class="sd-section"><div class="sd-sub">팀별</div>${teamRows}</div>`;
    }
    // 한 달 주문을 CSV(엑셀에서 열림)로 내려받기
    function downloadMonthCSV(){
      const byDay=statsByDay();
      if(!byDay){ toast("아직 불러오는 중이에요"); return; }
      const hm=t=>{ if(!t) return ""; const d=new Date(t); return isNaN(d)?"":`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
      const st={pending:"대기",confirmed:"제조 중",ready:"완료"};
      const rows=[["날짜","수령번호","시간대","팀","이름","대행 주문자","음료","상태","주문 시각","완료 시각"]];
      Object.keys(byDay).sort().forEach(day=>{
        Object.values(byDay[day]||{}).sort((a,b)=>(Number(a.no)||0)-(Number(b.no)||0) || new Date(a.time)-new Date(b.time)).forEach(o=>{
          const m=menuById(o.drinkId);
          rows.push([day, o.no||"", sessName(o.session), teamById(o.team).name, o.name||"", (o.by&&o.by!==o.name)?o.by:"",
            m?m.name:o.drinkId, st[o.status]||o.status||"", hm(o.time), hm(o.readyAt)]);
        });
      });
      if(rows.length===1){ toast("이 달에는 주문 기록이 없어요"); return; }
      const csv="\ufeff"+rows.map(r=>r.map(v=>{ const x=String(v??""); return /[",\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x; }).join(",")).join("\r\n");
      const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      const a=document.createElement("a"); a.href=url; a.download=`이안음료_${state.statsMonth}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast(`${rows.length-1}건을 내려받았어요`);
    }
    function renderStats(){
      const today = todayKey();
      if(!state.statsMonth){
        const t=new Date(); state.statsMonth=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`;
      }
      const [yr,mo] = state.statsMonth.split("-").map(Number);
      const firstDay = new Date(yr,mo-1,1).getDay(); // 0=일
      const daysInMonth = new Date(yr,mo,0).getDate();
      const prevMonth = mo===1?`${yr-1}-12`:`${yr}-${String(mo-1).padStart(2,"0")}`;
      const nextMonth = mo===12?`${yr+1}-01`:`${yr}-${String(mo+1).padStart(2,"0")}`;
      const todayYM = today.slice(0,7);
      const byDay=statsByDay();
      if(!byDay) setTimeout(()=>loadStatsMonth(state.statsMonth),0);
      const dayCnt=k=>byDay&&byDay[k]?Object.keys(byDay[k]).length:0;

      // 캘린더 HTML (날짜 아래에 그날 잔 수)
      let cells="";
      for(let i=0;i<firstDay;i++) cells+=`<div class="cal-cell empty"></div>`;
      for(let d=1;d<=daysInMonth;d++){
        const key=`${state.statsMonth}-${String(d).padStart(2,"0")}`;
        const isToday=key===today, isSel=key===state.statsDate, isFuture=key>today, c=dayCnt(key);
        cells+=`<div class="cal-cell${isToday?" today":""}${isSel?" sel":""}${isFuture?" future":""}" ${!isFuture?`data-calday="${key}"`:""}><span>${d}</span>${c?`<small class="cal-n">${c}</small>`:""}</div>`;
      }

      let detail="";
      if(state.statsDate){
        // 선택한 날짜 상세
        const orders = byDay ? (byDay[state.statsDate]||{}) : state.statsData;
        if(orders==null){
          detail=`<div class="stats-detail"><div class="empty">불러오는 중…</div></div>`;
        } else {
          const list=Object.values(orders);
          detail = list.length===0
            ? `<div class="stats-detail"><div class="empty">해당 날짜에 주문 기록이 없어요</div></div>`
            : `<div class="stats-detail"><div class="sd-head">${state.statsDate} · 총 ${list.length}잔 <span class="sd-back" data-calday="${state.statsDate}">월 요약 보기 ›</span></div>${rankRowsHTML(list)}</div>`;
        }
      } else if(!byDay){
        detail=`<div class="stats-detail"><div class="empty">${mo}월 기록을 불러오는 중…</div></div>`;
      } else {
        // 월 요약
        const days=Object.keys(byDay).filter(k=>dayCnt(k)>0);
        const list=days.flatMap(k=>Object.values(byDay[k]));
        const best=days.slice().sort((a,b)=>dayCnt(b)-dayCnt(a))[0];
        detail = list.length===0
          ? `<div class="stats-detail"><div class="empty">${mo}월에는 주문 기록이 없어요</div></div>`
          : `<div class="stats-detail">
              <div class="sd-head">${yr}년 ${mo}월 요약</div>
              <div class="msum">
                <div><b>${list.length}</b><small>총 잔 수</small></div>
                <div><b>${days.length}</b><small>운영일</small></div>
                <div><b>${(list.length/days.length).toFixed(1)}</b><small>하루 평균</small></div>
                <div><b>${best?Number(best.slice(8)):"-"}일</b><small>최다 (${best?dayCnt(best):0}잔)</small></div>
              </div>
              ${rankRowsHTML(list)}
              <button class="primary" style="margin-top:14px" data-act="csv">📥 ${mo}월 주문 내역 엑셀(CSV) 받기</button>
              <div class="dshint" style="margin-top:8px;text-align:center">날짜를 누르면 그날 상세를 볼 수 있어요</div>
            </div>`;
      }

      return `<button class="back" data-act="back">‹ 뒤로</button>
        <h1 class="serif" style="font-size:26px;margin-bottom:16px">집계</h1>
        <div class="cal-wrap">
          <div class="cal-nav">
            <button class="cal-arr" data-statsmonth="${prevMonth}">‹</button>
            <span class="cal-title">${yr}년 ${mo}월</span>
            <button class="cal-arr${state.statsMonth===todayYM?" disabled":""}" ${state.statsMonth===todayYM?"":`data-statsmonth="${nextMonth}"`}>›</button>
          </div>
          <div class="cal-grid">
            <div class="cal-dow-cell">일</div><div class="cal-dow-cell">월</div><div class="cal-dow-cell">화</div><div class="cal-dow-cell">수</div><div class="cal-dow-cell">목</div><div class="cal-dow-cell">금</div><div class="cal-dow-cell">토</div>
            ${cells}
          </div>
        </div>
        ${detail}`;
    }

          <div class="cal-grid">
            <div class="cal-dow-cell">일</div><div class="cal-dow-cell">월</div><div class="cal-dow-cell">화</div><div class="cal-dow-cell">수</div><div class="cal-dow-cell">목</div><div class="cal-dow-cell">금</div><div class="cal-dow-cell">토</div>

          <button class="qdel" data-holdel="${k}" aria-label="해제">✕</button>

    // 공통 주문 카드: 수령번호 배지 + (팀명·이름·대행) + 음료명, 오른쪽에 지정한 액션 요소
    // 메뉴 이름의 ICE/HOT을 분리 — 화면엔 작은 태그로, 나머지 이름만 크게 표시 (데이터는 그대로 둠, 앞/뒤 둘 다 인식)
    function splitTemp(name){
      const n=name||"";
      let mt=/^(.*)\s+(ICE|HOT)$/i.exec(n);
      if(mt) return {temp:mt[2].toUpperCase(), rest:mt[1]};
      mt=/^(ICE|HOT)\s+(.*)$/i.exec(n);
      if(mt) return {temp:mt[1].toUpperCase(), rest:mt[2]};
      return {temp:null, rest:n};
    }
    // 어디서든 재사용: 이름 + (있으면) ICE/HOT 작은 태그
    function drinkNameHTML(name){
      const {temp,rest}=splitTemp(name);
      return `${esc(rest)}${temp?` <span class="temptag ${temp==='ICE'?'ice':'hot'}">${temp}</span>`:``}`;
    }
    function orderCardHTML(o, rowClass, badgeClass, actionHTML){
      const t=teamById(o.team), m=menuById(o.drinkId);
      const {temp,rest}=splitTemp(m?m.name:o.drinkId);
      return `<div class="qrow${rowClass?` ${rowClass}`:""}">

          </div>
          <button class="swt2${on?' on':''}" data-mtoggle="${i}" aria-label="${on?'판매 중 (눌러서 품절)':'품절 (눌러서 판매)'}"><span class="swt2-t"></span></button>

        <div class="msum">
          <button class="mpill${!onlyOff?' on':''}" data-mfilter="all">전체 ${all.length}</button>
          <button class="mpill" data-mfilter="all" style="pointer-events:none">판매 중 ${onCnt}</button>
          <button class="mpill off${onlyOff?' on':''}" data-mfilter="off">품절 ${offCnt}${onlyOff?" · 보는 중":""}</button>

        ${onlyOff && !offCnt ? `<div class="empty small">품절인 메뉴가 없어요</div>` : group("ice")+group("hot")}
        ${state.addMenuOpen?`<div class="addmenuform">
          <input class="nm" id="newMenuName" placeholder="음료 이름 (예: 아메리카노)" autofocus/>
          <div class="tempchecks">

            <label class="chk"><input type="checkbox" id="newMenuHot"/> HOT</label>

    // ---- time editor ----
    function hourOpts(sel){ let o=""; for(let h=0;h<=23;h++){const v=String(h).padStart(2,"0");o+=`<option value="${v}"${v===sel?" selected":""}>${v}시</option>`;} return o; }
    function minOpts(sel){ let o=""; for(let m=0;m<=50;m+=10){const v=String(m).padStart(2,"0");o+=`<option value="${v}"${v===sel?" selected":""}>${v}분</option>`;} return o; }
    function timeRow(label, idH, idM, hhmm){
      const [hh,mm]=hhmm.split(":");
      return `<div class="trow">
        <span class="trl">${label}</span>
        <select id="${idH}" class="tsel">${hourOpts(hh)}</select>
        <select id="${idM}" class="tsel">${minOpts(mm)}</select>
      </div>`;
    }
    function sessionBlock(key, title, prefix, hhmmStart, hhmmEnd, on){
      return `<div class="timefield${on?'':' sess-off'}">
        <div class="tcap-row">
          <div class="tcap">${title}</div>
          <button class="swt2 ${on?'on':''}" data-act="toggle${key}Session"><span class="swt2-t"></span></button>
        </div>
        ${on?`${timeRow("시작", prefix+"Sh",prefix+"Sm", hhmmStart)}${timeRow("마감", prefix+"Eh",prefix+"Em", hhmmEnd)}`
            :`<div class="sess-off-note">이 시간대는 주문을 받지 않아요</div>`}
      </div>`;
    }
    function renderTimeEdit(){
      const h=state.hoursDraft||state.hours;
      return `<button class="back" data-act="back">‹ 뒤로</button>
        <h1 class="serif" style="font-size:26px;margin-bottom:4px">주문 시간 설정</h1>
        <div class="sub" style="font-size:14px;color:var(--sub);margin-bottom:16px">오전·점심·오후 주문 시작/마감 시간을 조정하고, 필요 없는 시간대는 꺼두세요</div>
        ${sessionBlock("Am","오전 주문","am", h.amStart, h.amEnd, h.amOn!==false)}
        ${sessionBlock("Ln","점심 주문","ln", h.lnStart||"11:30", h.lnEnd||"13:00", h.lnOn!==false)}
        ${sessionBlock("Pm","오후 주문","pm", h.pmStart, h.pmEnd, h.pmOn!==false)}
        <button class="primary" style="margin-top:8px" data-act="saveTime">저장하기</button>
        <div class="footnote">마감 시간이 지나면 새 주문은 자동으로 차단됩니다. 이미 들어온 주문은 그대로 유지돼요. 꺼둔 시간대는 직원 화면에서 보이지 않아요.</div>`;

    // ============ EVENTS ============
    // 음료명이 한 줄에 안 들어가면(두 줄로 안 넘어가고) 자동으로 글자 크기를 줄여서 맞춤
    function fitQdrinkText(){
      document.querySelectorAll(".qdname").forEach(el=>{
        let size=parseFloat(getComputedStyle(el).fontSize);
        const min=12;
        let guard=0;
        while(el.scrollWidth>el.clientWidth+1 && size>min && guard<24){
          size-=0.5; el.style.fontSize=size+"px"; guard++;
        }
      });
    }
    function bind(){
      document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>handle(el.dataset.act,el));
      document.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>placeOrder(el.dataset.pick));
      document.querySelectorAll("[data-addteam]").forEach(el=>el.onclick=()=>{ state.addTeam=el.dataset.addteam; render(); });
      document.querySelectorAll("[data-addpick]").forEach(el=>el.onclick=()=>addPersonOrder(el.dataset.addpick));
      document.querySelectorAll("[data-ack]").forEach(el=>el.onclick=()=>ackNotif(el.dataset.ack));
      document.querySelectorAll("[data-qstep]").forEach(el=>el.onclick=()=>stepOrder(el.dataset.qstep));
      document.querySelectorAll("[data-holday]").forEach(el=>el.onclick=()=>{ readHolInputs(); const k=el.dataset.holday, d=state.holDraft.days; if(k in d) delete d[k]; else d[k]=""; render(); });
      document.querySelectorAll("[data-holdel]").forEach(el=>el.onclick=()=>{ readHolInputs(); delete state.holDraft.days[el.dataset.holdel]; render(); });
      document.querySelectorAll("[data-holmonth]").forEach(el=>el.onclick=()=>{ readHolInputs(); state.holMonth=el.dataset.holmonth; render(); });
      document.querySelectorAll("[data-qundo]").forEach(el=>el.onclick=()=>undoReady(el.dataset.qundo));
      document.querySelectorAll("[data-qfilter]").forEach(el=>el.onclick=()=>{ const d=el.dataset.qfilter; state.qFilter = state.qFilter===d ? null : d; render(); });
      document.querySelectorAll("[data-qbatch]").forEach(el=>el.onclick=()=>batchStep(el.dataset.qbatch));
      document.querySelectorAll("[data-disp]").forEach(el=>el.onclick=()=>{ state.dispSession=el.dataset.disp; render(); });
      document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{ readMenuInputs(); const m=state.menu[+el.dataset.del]; if(!m || !confirm(`"${m.name}" 메뉴를 삭제할까요? (저장하기를 눌러야 반영돼요)`)) return; state.menu.splice(+el.dataset.del,1); state.menuOpen=null; render(); });
      // 메뉴 관리: 줄 누르면 펼치기/접기, 품절만 보기, 위·아래 이동(같은 그룹 안에서), 그룹 바꾸기
      document.querySelectorAll("[data-mrow]").forEach(el=>el.onclick=()=>{ readMenuInputs(); const id=el.dataset.mrow; state.menuOpen = state.menuOpen===id?null:id; render(); });
      document.querySelectorAll("[data-mfilter]").forEach(el=>el.onclick=()=>{ readMenuInputs(); state.menuFilter=el.dataset.mfilter; state.menuOpen=null; render(); });
      document.querySelectorAll("[data-mmove]").forEach(el=>el.onclick=()=>{
        readMenuInputs(); const [i,d]=el.dataset.mmove.split("|").map(Number), m=state.menu[i]; if(!m) return;
        const g=menuTemp(m); let j=i+d;
        while(j>=0 && j<state.menu.length && menuTemp(state.menu[j])!==g) j+=d; // 같은 그룹의 바로 위/아래 메뉴와 자리 바꿈
        if(j<0 || j>=state.menu.length) return;
        [state.menu[i],state.menu[j]]=[state.menu[j],state.menu[i]]; render();
      });
      document.querySelectorAll("[data-mgroup]").forEach(el=>el.onclick=()=>{ readMenuInputs(); const m=state.menu[+el.dataset.mgroup]; if(!m) return; m.temp = menuTemp(m)==="ice"?"hot":"ice"; toast(`${TEMP_LABEL[m.temp]} 그룹으로 옮겼어요`); render(); });
      document.querySelectorAll("[data-tdel]").forEach(el=>el.onclick=()=>{ if(state.teams.length<=1){toast("최소 1개 팀은 있어야 해요");return;} readTeamInputs(); state.teams.splice(+el.dataset.tdel,1); render(); });
      document.querySelectorAll("[data-editorder]").forEach(el=>el.onclick=()=>{ state.editOrderId=el.dataset.editorder; state.view="edit-order"; render(); });
      document.querySelectorAll("[data-delorder]").forEach(el=>el.onclick=()=>delOrder(el.dataset.delorder));
      document.querySelectorAll("[data-editpick]").forEach(el=>el.onclick=()=>editOrderDrink(el.dataset.editpick));
      document.querySelectorAll("[data-mpick]").forEach(el=>el.onclick=()=>{ readMenuInputs(); const id=el.dataset.mpick; state.menuPickOpen = (state.menuPickOpen===id)?null:id; render(); });
      document.querySelectorAll("[data-mcolor]").forEach(el=>el.onclick=()=>{ const [i,c]=el.dataset.mcolor.split("|"); readMenuInputs(); const me=state.menu[+i]; if(me){ const j=state.menu.findIndex((m,k)=>k!==+i && _lc(m.color)===_lc(c)); if(j>=0){ state.menu[j].color = me.color || freeMenuColor(state.menu, j) || menuColorFor(j); toast(`"${state.menu[j].name||"다른"}" 메뉴와 색을 맞바꿨어요`); } me.color=c; } render(); });
      document.querySelectorAll("[data-mtoggle]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.mtoggle; readMenuInputs(); if(state.menu[i]) state.menu[i].active = !(state.menu[i].active!==false); render(); });
      // 집계 캘린더 월 이동
      document.querySelectorAll("[data-statsmonth]").forEach(el=>el.onclick=()=>{ state.statsMonth=el.dataset.statsmonth; state.statsDate=null; state.statsData=null; state.statsMonthData=null; render(); });
      // 집계 캘린더 날짜 선택 → Firestore 1회 조회
      document.querySelectorAll("[data-calday]").forEach(el=>el.onclick=async()=>{
        const key=el.dataset.calday;
        if(state.statsDate===key){ state.statsDate=null; state.statsData=null; render(); return; }
        state.statsDate=key; state.statsData=null; render();
        if(statsByDay()) return; // 한 달치를 이미 불러왔으면 추가 조회 없이 바로 표시
        if(key===todayKey()){ state.statsData=state.orders; render(); return; }
        try{
          const snap=await getDoc(doc(db,"daily",key));
          state.statsData=snap.exists()?(snap.data().orders||{}):{};
        }catch(e){ state.statsData={}; }
        render();
      });
      const an=document.getElementById("addName"); if(an) an.addEventListener("input",e=>{ noSpaceInput(e); state.addName=e.target.value; });
      const gd=document.getElementById("guide"); if(gd) gd.addEventListener("toggle",()=>{ state.guideOpen=gd.open; });
    }

    function handle(act){
      switch(act){
        case "logout": if(confirm("로그아웃 할까요? (다시 이름·팀을 입력해야 해요)")){localStorage.removeItem("ian_user");state.user=null;render();} break;
        case "bell": state.view="notifications"; render(); break;
        case "goOrder": state.view="order"; render(); break;
        case "goAdd": state.addTeam=state.user.team!=="barista"?state.user.team:null; state.addName=""; state.view="add-person"; render(); break;
        case "goTeamList": state.dispSession=sessionState().session||"am"; state.view="team-list"; render(); break;
        case "back": state.view="home"; render(); break;
        case "backToList": state.view="team-list"; render(); break;
        case "disp": state.dispSession=sessionState().session||"am"; state.view="disp"; render(); break;
        case "editMenu": state.menuPickOpen=null; state.menuOpen=null; state.menuFilter="all"; state.addMenuOpen=false; state.view="menu-edit"; render(); break;
        case "stats": state.view="stats"; state.statsDate=null; state.statsData=null; state.statsMonthData=null; render(); break;
        case "editNotice": state.view="notice-edit"; render(); break;
        case "saveNotice": doSaveNotice(); break;
        case "clearNotice":
          if(!confirm("공지사항을 내릴까요?")) break;
          saveNotice("").then(()=>{ state.view="home"; render(); toast("공지사항을 내렸어요"); });
          break;
        case "editTeams": state.view="team-edit"; render(); break;
        case "editTime": state.hoursDraft={...state.hours}; state.view="time-edit"; render(); break;
        case "toggleAmSession": readHoursDraft(); state.hoursDraft.amOn = !(state.hoursDraft.amOn!==false); render(); break;
        case "toggleLnSession": readHoursDraft(); state.hoursDraft.lnOn = !(state.hoursDraft.lnOn!==false); render(); break;
        case "togglePmSession": readHoursDraft(); state.hoursDraft.pmOn = !(state.hoursDraft.pmOn!==false); render(); break;
        case "refresh": toast("최신 상태예요"); render(); break;
        case "editHol": state.holDraft={days:{...((state.holidays||{}).days||{})}}; state.holMonth=null; state.view="hol-edit"; render(); break;
        case "saveHol": doSaveHol(); break;
        case "clearQFilter": state.qFilter=null; render(); break;
        case "csv": downloadMonthCSV(); break;
        case "toggleSound":
          state.soundOn=!state.soundOn;
          localStorage.setItem("ian_sound", JSON.stringify(state.soundOn));
          armAudio();
          render();
          if(state.soundOn){ playDing("신규 음료 주문"); toast("새 주문 알림 소리 켜짐"); } else toast("새 주문 알림 소리 꺼짐");
          break;
        case "toggleAwake":
          if(!("wakeLock" in navigator)){ toast("이 기기는 화면 유지를 지원하지 않아요"); break; }
          state.keepAwake=!state.keepAwake;
          armAudio();
          maybeWake();
          render();
          toast(state.keepAwake?"화면이 꺼지지 않게 유지해요 🔆":"화면 유지를 껐어요");
          break;
        case "addMenu": readMenuInputs(); state.menuOpen=null; state.menuFilter="all"; state.addMenuOpen=true; render(); break;
        case "cancelAddMenu": state.addMenuOpen=false; render(); break;
        case "confirmAddMenu": {
          const nameEl=document.getElementById("newMenuName");
          const base=(nameEl?nameEl.value:"").trim();
          if(!base){ toast("음료 이름을 입력해 주세요"); break; }
          const ice=document.getElementById("newMenuIce").checked;
          const hot=document.getElementById("newMenuHot").checked;
          readMenuInputs();
          const need = (ice||hot) ? (ice?1:0)+(hot?1:0) : 1;
          const freeCnt = MENU_COLORS.filter(c=>!state.menu.some(m=>_lc(m.color)===_lc(c))).length;
          if(freeCnt < need){ toast("남은 색상이 없어요. 안 쓰는 메뉴를 삭제한 뒤 추가해 주세요"); break; }
          if(!ice && !hot){
            state.menu.push({id:"m"+Date.now(), name:base, color:freeMenuColor(state.menu), temp:"ice"});
          } else {
            if(ice) state.menu.push({id:"m"+Date.now()+"i", name:`${base} ICE`, color:freeMenuColor(state.menu), temp:"ice"});
            if(hot) state.menu.push({id:"m"+Date.now()+"h", name:`${base} HOT`, color:freeMenuColor(state.menu), temp:"hot"});
          }
          state.addMenuOpen=false; render(); toast(`${base} 추가했어요`);
          break;
        }
        case "addTeam": readTeamInputs(); state.teams.push({id:"t"+Date.now(),name:"새 팀",color:colorFor(state.teams.length)}); render(); break;
        case "saveMenu": doSaveMenu(); break;
        case "saveTeams": doSaveTeams(); break;
        case "saveTime": doSaveTime(); break;
      }
    }

    let _orderInFlight=false; // 연속 탭 방지: 처리 중일 땐 같은 요청을 무시
    // 주문 저장 중 표시 (몰릴 땐 몇 초 걸릴 수 있어서 아무 반응 없는 것처럼 보이지 않게)
    function busyToast(m){ clearTimeout(tTimer); toastEl.textContent=m; toastEl.classList.add("show"); tTimer=setTimeout(()=>toastEl.classList.remove("show"),15000); }
    async function placeOrder(drinkId){
      if(_orderInFlight) return;
      _orderInFlight=true;
      busyToast("주문 넣는 중이에요…");
      try{
        const ss=sessionState();
        if(!ss.open){ toast("지금은 주문 시간이 아니에요"); state.view="home"; render(); return; }
        const mine=myTodayOrder();
        const fields={
          team:state.user.team, name:state.user.name, drinkId,
          session:ss.session, status:"pending", time:new Date().toISOString(), by:state.user.name
        };
        let id;
        if(mine){
          if(mine.drinkId===drinkId && mine.status==="pending"){ state.view="home"; render(); toast("이미 이 음료로 주문돼 있어요"); return; }
          const res=await updateOrder(mine.id, cur=> cur.status!=="pending" ? "started" : {...cur, ...fields, no:cur.no});
          if(res.err){ state.view="home"; orderFailToast(res); return; }
          id=mine.id;
        } else {
          id="o-"+Date.now();
          await commitNewOrder({...fields, id});
        }
        try{ localStorage.setItem("ian_last", drinkId); }catch(e){}
        state.view="home"; render();
        showUndo(mine?"음료를 변경했어요 ☕":"주문했어요 ☕", undoForOrder(id, mine?mine.drinkId:null, ""));
      } catch(e){ console.error(e); toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요"); }
      finally { _orderInFlight=false; }
    }

    // ---- 주문 직후 몇 초간 "취소" (잘못 누름 방지) ----
    let _undoTimer=null, _undoFn=null;
    function showUndo(text, fn){
      const bar=document.getElementById("undobar");
      clearTimeout(_undoTimer); _undoFn=fn;
      toastEl.classList.remove("show");
      bar.querySelector(".ub-t").textContent=text;
      bar.classList.add("show");
      _undoTimer=setTimeout(hideUndo, 6000);
    }
    function hideUndo(){ clearTimeout(_undoTimer); _undoFn=null; const bar=document.getElementById("undobar"); if(bar) bar.classList.remove("show"); }
    async function runUndo(){
      const fn=_undoFn; hideUndo(); if(!fn) return;
      try{ await fn(); }catch(e){ console.error(e); toast("취소하지 못했어요"); }
      render();
    }
    // 아직 "대기"인 주문만 삭제 (서버에서 확인) → null | "gone" | "started"
    async function deletePendingOrder(id){
      const ref=doc(db,"daily",todayKey());
      const err=await txRun(async tx=>{
        const snap=await tx.get(ref);
        const cur=snap.exists() ? (snap.data().orders||{})[id] : null;
        if(!cur) return "gone";
        if(cur.status!=="pending") return "started";
        tx.update(ref, new FieldPath("orders", id), deleteField());
        return null;
      });
      if(!err){ const n={...state.orders}; delete n[id]; state.orders=n; }
      return err;
    }
    // 새 주문 → 취소(삭제) / 음료 변경 → 이전 음료로 되돌림
    function undoForOrder(id, prevDrinkId, who){
      return async()=>{
        if(!prevDrinkId){
          const err=await deletePendingOrder(id);
          toast(err==="started" ? "이미 제조가 시작돼서 취소할 수 없어요" : err==="gone" ? "이미 삭제된 주문이에요" : `${who}주문을 취소했어요`);
        } else {
          const res=await updateOrder(id, cur=> cur.status!=="pending" ? "started" : {...cur, drinkId:prevDrinkId});
          if(!orderFailToast(res)) toast("원래 음료로 되돌렸어요");
        }
      };
    }
    // 늘 마시던 음료 (이 기기에서 마지막으로 주문한 내 음료)
    const lastDrinkId = () => localStorage.getItem("ian_last");

    async function addPersonOrder(drinkId){
      if(_orderInFlight) return;
      _orderInFlight=true;
      if(state.addName && nm(state.addName)) busyToast("주문 넣는 중이에요…");
      try{
        const ss=sessionState();
        if(!ss.open){ toast("지금은 주문 시간이 아니에요"); return; }
        const name=nm(state.addName);
        if(!name){ toast("이름을 입력하세요"); return; }
        const team=state.user.team; // 대행 주문은 항상 본인 팀으로 고정
        // prevent dup: same team+name today
        const dup=Object.entries(state.orders).find(([_,o])=>o.team===team&&sameName(o.name,name));
        const fields={team, name, drinkId, session:ss.session, status:"pending", time:new Date().toISOString(), by:state.user.name};
        if(dup){
          // 이미 제조 중이거나 완료된 주문은 바꾸지 않음 (하루 1잔 — 완료된 음료를 새 주문으로 덮어쓰는 것 방지)
          const res=await updateOrder(dup[0], cur=> cur.status!=="pending" ? "started" : {...cur, ...fields, no:cur.no});
          if(res.err){ state.addName=""; state.view="home"; orderFailToast(res); return; }
        }
        const id = dup ? dup[0] : "o-"+Date.now();
        if(!dup) await commitNewOrder({...fields, id});
        state.addName=""; state.view="home"; render();
        showUndo(`${name}님 주문을 ${dup?"변경":"추가"}했어요`, undoForOrder(id, dup?dup[1].drinkId:null, `${name}님 `));
      } catch(e){ console.error(e); toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요"); }
      finally { _orderInFlight=false; }
    }

    // 🔔 알림 "확인" → 이 기기에서만 알림을 지움 (서버에는 아무것도 안 씀)
    function ackNotif(id){
      if(!state.seenReady.includes(id)){ state.seenReady.push(id); localStorage.setItem("ian_seen",JSON.stringify(state.seenReady)); }
      state.view="home"; render(); toast("맛있게 드세요 ☕");
    }

    async function delOrder(id){
      const o=state.orders[id]; if(!o) return;
      const isBarista=state.user.team==="barista";
      if(!isBarista && o.status!=="pending"){ toast("이미 제조가 시작돼서 삭제할 수 없어요"); render(); return; }
      if(!confirm(`${o.name}님 주문을 삭제할까요?`)) return;
      if(isBarista){
        // 담당자는 상태와 관계없이 삭제 가능 — 해당 항목만 콕 집어 서버에서 제거
        await setDoc(doc(db,"daily",todayKey()),{orders:{[id]:deleteField()}},{merge:true});
      } else {
        // 직원은 서버에서 아직 "대기"인지 확인한 뒤에만 삭제 (확인 창 띄운 사이 제조가 시작됐을 수 있음)
        const err=await deletePendingOrder(id);
        if(err==="started"){ toast("이미 제조가 시작돼서 삭제할 수 없어요"); render(); return; }
        if(err==="gone"){ toast("이미 삭제된 주문이에요"); render(); return; }
      }
      const n={...state.orders}; delete n[id];
      state.orders=n;
      // if I deleted my own order, go home; otherwise stay on list
      if(sameName(o.name,state.user.name) && o.team===state.user.team){ state.view="home"; }
      render(); toast(`${o.name}님 주문을 삭제했어요`);
    }
    async function editOrderDrink(drinkId){
      const id=state.editOrderId, o=state.orders[id];
      if(!o){ state.view="team-list"; render(); return; }
      const res=await updateOrder(id, cur=> cur.status!=="pending" ? "started" : {...cur, drinkId});
      if(res.err){ state.view="team-list"; orderFailToast(res); return; }
      state.view="team-list"; render(); toast(`${o.name}님 음료를 변경했어요`);
    }

    // 개별 주문 상태 전환: 대기 → 제조 중(시작) → 완료
    // 서버의 현재 상태가 화면에서 본 상태와 같을 때만 다음 단계로 (연타·다른 기기 동시 처리 시 단계 건너뜀 방지)
    const _stepInFlight=new Set(); // 같은 주문 버튼 연타 방지
    async function stepOrder(id){
      const o=state.orders[id]; if(!o || _stepInFlight.has(id)) return;
      _stepInFlight.add(id);
      try{ await _stepOrder(id, o); } finally { _stepInFlight.delete(id); }
    }
    async function _stepOrder(id, o){
      const from=o.status;
      if(from!=="pending" && from!=="confirmed") return;
      const res=await updateOrder(id, cur=>{
        if(cur.status!==from) return "stale";
        if(from==="pending" && cur.drinkId!==o.drinkId) return "changed"; // 누르는 순간 직원이 음료를 바꿨으면 멈춤 (엉뚱한 음료 제조 방지)
        return from==="pending" ? {...cur,status:"confirmed"} : {...cur,status:"ready",readyAt:new Date().toISOString()};
      });
      if(orderFailToast(res)) return;
      render();
      toast(from==="pending" ? `${o.name}님 음료 제조를 시작했어요` : `${o.name}님 음료 완료! 알림을 보냈어요`);
    }

    // ---- 담당자: 되돌리기 / 수령 / 묶어서 처리 ----
    let _baristaBusy=false;
    async function baristaOp(fn){ if(_baristaBusy) return; _baristaBusy=true; try{ await fn(); } catch(e){ console.error(e); toast("처리하지 못했어요. 다시 시도해 주세요"); } finally{ _baristaBusy=false; render(); } }
    // 완료를 잘못 눌렀을 때: 완료 → 제조 중으로 되돌림 (완료·수령 시각 제거)
    function undoReady(id){
      return baristaOp(async()=>{
        const res=await updateOrder(id, cur=>{
          if(cur.status!=="ready") return "stale";
          const {readyAt, pickedAt, pickedBy, ...rest}=cur;
          return {...rest, status:"confirmed"};
        });
        if(!orderFailToast(res)) toast(`${res.ok.name}님 음료를 제조 중으로 되돌렸어요`);
      });
    }
    // 같은 음료 묶어서 한 번에: 대기 → 제조 시작 / 제조 중 → 완료
    function batchStep(kind){
      const dId=state.qFilter; if(!dId) return;
      const from = kind==="start" ? "pending" : "confirmed";
      const ids=Object.entries(state.orders).filter(([id,o])=>o.drinkId===dId && o.status===from).map(([id])=>id);
      if(!ids.length) return;
      return baristaOp(async()=>{
        const now=new Date().toISOString();
        const n=await updateOrders(ids, cur=>{
          if(cur.status!==from) return "skip";
          return kind==="start" ? {...cur, status:"confirmed"} : {...cur, status:"ready", readyAt:now};
        });
        toast(kind==="start" ? `${n}잔 제조를 시작했어요` : `${n}잔 완료! 알림을 보냈어요`);
      });
    }

    // read current edit-field values back into state (prevents reset on re-render)
    function readMenuInputs(){
      document.querySelectorAll("[data-nm]").forEach(inp=>{const i=+inp.dataset.nm;if(state.menu[i])state.menu[i].name=inp.value;});
    }
    function readTeamInputs(){
      document.querySelectorAll("[data-tnm]").forEach(inp=>{const i=+inp.dataset.tnm;if(state.teams[i])state.teams[i].name=inp.value;});
    }
    async function doSaveMenu(){
      readMenuInputs();
      state.menu = dedupeMenuColors(state.menu);
      await saveMenu(state.menu); state.view="home"; render(); toast("메뉴를 저장했어요");
    }
    async function doSaveTeams(){
      readTeamInputs();
      state.teams.forEach((t,i)=>{ if(!t.color) t.color=colorFor(i); if(!t.name) t.name="이름없음"; });
      await saveTeams(state.teams);
      state.view="home"; render(); toast("팀을 저장했어요");
    }
    async function doSaveNotice(){
      const v=document.getElementById("noticeTxt").value;
      await saveNotice(v);
      state.view="home"; render(); toast(v.trim()?"공지사항을 저장했어요":"공지사항이 비어 있어 표시되지 않아요");
    }
    function readHoursDraft(){
      // 화면에 존재하는 시간 select만 읽어서 draft에 반영 (꺼진 세션은 select가 없어 기존 draft 값 유지)
      const g=id=>{const el=document.getElementById(id); return el?el.value:null;};
      const d=state.hoursDraft; if(!d) return;
      if(g("amSh")!==null){ d.amStart=`${g("amSh")}:${g("amSm")}`; d.amEnd=`${g("amEh")}:${g("amEm")}`; }
      if(g("lnSh")!==null){ d.lnStart=`${g("lnSh")}:${g("lnSm")}`; d.lnEnd=`${g("lnEh")}:${g("lnEm")}`; }
      if(g("pmSh")!==null){ d.pmStart=`${g("pmSh")}:${g("pmSm")}`; d.pmEnd=`${g("pmEh")}:${g("pmEm")}`; }
    }
    async function doSaveTime(){
      readHoursDraft();
      const h={...state.hoursDraft};
      await saveHours(h); state.hoursDraft=null; state.view="home"; render(); toast("주문 시간을 저장했어요");
    }

    // 자동 업데이트: GitHub에 올라온 최신 파일의 버전과 다르면 캐시 우회해서 강제로 새로고침
    async function checkForUpdate(){
      try{
        const res = await fetch(location.pathname + "?_=" + Date.now(), {cache:"no-store"});
        if(!res.ok) return;
        const text = await res.text();
        const m = /APP_BUILD\s*=\s*"([^"]+)"/.exec(text);
        if(m && m[1] && m[1] !== APP_BUILD && !EDIT_VIEWS.has(state.view)){
          location.href = location.pathname + "?v=" + encodeURIComponent(m[1]);
        }
      }catch(e){}
    }
    // boot
    try{ if("speechSynthesis" in window){ _voices=speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{ _voices=speechSynthesis.getVoices(); }; } }catch(e){}
    startSync(); render();
    checkForUpdate();
    setInterval(()=>{ subscribeDaily(); checkForUpdate(); if(state.user&&state.view==="home") render(); }, 60000); // 매분: 날짜 전환 + 자동 업데이트 확인 + 주문 시간 상태 갱신
  </script>
</body>
</html>
